[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-copilot"
version = "0.1.0"
description = "Module 12 - AI Operations Copilot (Impl-1 foundation + core stories)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["planning", "_bmad", ".claude", ".agents", ".opencode", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

# R1 / R3 (ports-and-adapters.md): the pure core and the ports must not import
# frameworks, DB drivers, randomness or network clients. Adapters, the composition
# root and the tests may.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "src/domain and src/ports must stay framework-free (R1/R4)."
"sqlite3".msg = "src/domain and src/ports must not import DB drivers (R1)."
"random".msg = "Randomness only through an injected port (R2)."
"uuid".msg = "Ids only through idgen_port (R2)."
"httpx".msg = "No network clients in the core (R1)."
"requests".msg = "No network clients in the core (R1)."

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/adapters/**" = ["TID251"]
"src/*.py" = ["TID251"]
"tests/**" = ["TID251"]
# Phase-3 test harness: authored before this ruff config; kept untouched (style rules only).
"tests/support/**" = ["E501", "F401", "I001", "UP"]
"tests/conftest.py" = ["E501", "I001", "UP"]
"tests/test_example.py" = ["E501", "I001", "UP"]
"tests/integration/test_db_schema.py" = ["E501", "I001", "UP"]
"tests/unit/test_explain_assert.py" = ["E501", "I001", "UP"]
"tests/unit/test_fake_clock.py" = ["E501", "I001", "UP"]
"tests/unit/test_seed_fleet.py" = ["E501", "I001", "UP"]
"tests/unit/test_sim_telemetry.py" = ["E501", "I001", "UP"]
