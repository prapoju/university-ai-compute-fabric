[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
python_files = test_*.py *.test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
addopts = -ra --strict-markers --import-mode=importlib
markers =
    unit: isolated, no external I/O (default share of the pyramid)
    integration: exercises the migrated SQLite schema / real DDL
    api: HTTP surface (/api/v1, /executor/v1)
    slow: opt-in slower checks
    determinism: I2 / FR-14 identity across repeated runs
    atdd: ATDD red-phase contract suite (test/atdd); run with `pytest test/atdd`
