<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="780" height="470" fill="#ffffff"/>

  <!-- system boundary -->
  <rect x="210" y="20" width="360" height="430" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="390" y="45" text-anchor="middle" font-weight="bold">AI Operations Copilot</text>

  <!-- use cases -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <ellipse cx="390" cy="100" rx="150" ry="28"/>
    <ellipse cx="390" cy="170" rx="150" ry="28"/>
    <ellipse cx="390" cy="240" rx="150" ry="28"/>
    <ellipse cx="390" cy="310" rx="150" ry="28"/>
    <ellipse cx="390" cy="380" rx="150" ry="28"/>
  </g>
  <g text-anchor="middle">
    <text x="390" y="105">Ask about access, jobs or machines</text>
    <text x="390" y="175">Copy the runbook</text>
    <text x="390" y="245">Request a job or machine action</text>
    <text x="390" y="315">Confirm the action</text>
    <text x="390" y="385">View history and audit log</text>
  </g>

  <!-- actor: Operator -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <circle cx="95" cy="195" r="14"/>
    <line x1="95" y1="209" x2="95" y2="255"/>
    <line x1="70" y1="225" x2="120" y2="225"/>
    <line x1="95" y1="255" x2="75" y2="285"/>
    <line x1="95" y1="255" x2="115" y2="285"/>
  </g>
  <text x="95" y="305" text-anchor="middle">Operator</text>

  <!-- actor: Executor -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <circle cx="685" cy="265" r="14"/>
    <line x1="685" y1="279" x2="685" y2="325"/>
    <line x1="660" y1="295" x2="710" y2="295"/>
    <line x1="685" y1="325" x2="665" y2="355"/>
    <line x1="685" y1="325" x2="705" y2="355"/>
  </g>
  <text x="685" y="375" text-anchor="middle">Executor</text>

  <!-- associations -->
  <g stroke="#000" stroke-width="1.2">
    <line x1="125" y1="225" x2="242" y2="106"/>
    <line x1="125" y1="225" x2="241" y2="174"/>
    <line x1="125" y1="225" x2="240" y2="240"/>
    <line x1="125" y1="225" x2="241" y2="306"/>
    <line x1="125" y1="225" x2="243" y2="374"/>
    <line x1="655" y1="295" x2="539" y2="311"/>
  </g>
</svg>
