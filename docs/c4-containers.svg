<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="20" y="28" font-weight="bold" font-size="16">Containers: AI Operations Copilot</text>

  <!-- person: Operator -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <circle cx="500" cy="55" r="14"/>
    <line x1="500" y1="69" x2="500" y2="105"/>
    <line x1="475" y1="83" x2="525" y2="83"/>
    <line x1="500" y1="105" x2="480" y2="132"/>
    <line x1="500" y1="105" x2="520" y2="132"/>
  </g>
  <text x="500" y="152" text-anchor="middle" font-weight="bold">Operator</text>
  <text x="500" y="169" text-anchor="middle" font-size="12">[Person]</text>

  <!-- system boundary -->
  <rect x="40" y="190" width="920" height="440" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="56" y="618" font-weight="bold" font-size="13">AI Operations Copilot [Software System]</text>

  <!-- containers -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <rect x="380" y="210" width="240" height="70"/>
    <rect x="380" y="310" width="240" height="70"/>
    <rect x="380" y="420" width="240" height="70"/>
    <rect x="60" y="420" width="240" height="70"/>
    <rect x="700" y="420" width="240" height="70"/>
    <rect x="380" y="530" width="240" height="70"/>
  </g>
  <g text-anchor="middle">
    <text x="500" y="234" font-weight="bold">Console</text>
    <text x="500" y="252" font-size="12">[React, TypeScript]</text>
    <text x="500" y="269" font-size="12">Chat, cited answers, runbook copy</text>

    <text x="500" y="334" font-weight="bold">HTTP API</text>
    <text x="500" y="352" font-size="12">[FastAPI]</text>
    <text x="500" y="369" font-size="12">Routes and error responses</text>

    <text x="500" y="444" font-weight="bold">Application</text>
    <text x="500" y="462" font-size="12">[Python]</text>
    <text x="500" y="479" font-size="12">Use cases: diagnose, preview, confirm</text>

    <text x="180" y="444" font-weight="bold">Domain</text>
    <text x="180" y="462" font-size="12">[Python, pure]</text>
    <text x="180" y="479" font-size="12">Rules: intent, safety, citations</text>

    <text x="820" y="444" font-weight="bold">Database</text>
    <text x="820" y="462" font-size="12">[SQLite]</text>
    <text x="820" y="479" font-size="12">Sessions, proposals, audit log</text>

    <text x="500" y="554" font-weight="bold">Simulated providers</text>
    <text x="500" y="572" font-size="12">[Python]</text>
    <text x="500" y="589" font-size="12">Lab data, prose writer, executor</text>
  </g>

  <!-- external: fixtures -->
  <rect x="380" y="670" width="240" height="70" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="500" y="694" font-weight="bold">Fixtures</text>
    <text x="500" y="712" font-size="12">[JSON files]</text>
    <text x="500" y="729" font-size="12">Users, jobs, machines, runbooks</text>
  </g>

  <!-- relationships -->
  <g stroke="#000" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="500" y1="176" x2="500" y2="207"/>
    <line x1="500" y1="280" x2="500" y2="307"/>
    <line x1="500" y1="380" x2="500" y2="417"/>
    <line x1="380" y1="455" x2="303" y2="455"/>
    <line x1="620" y1="455" x2="697" y2="455"/>
    <line x1="500" y1="490" x2="500" y2="527"/>
    <line x1="500" y1="600" x2="500" y2="667"/>
  </g>
  <g font-size="12">
    <text x="510" y="184">Uses</text>
    <text x="510" y="298">JSON over HTTP</text>
    <text x="510" y="403">Calls use cases</text>
    <text x="341" y="447" text-anchor="middle">Uses</text>
    <text x="659" y="447" text-anchor="middle">Stores</text>
    <text x="510" y="513">Reads data, sends actions</text>
    <text x="510" y="650">Loads at start</text>
  </g>
</svg>
